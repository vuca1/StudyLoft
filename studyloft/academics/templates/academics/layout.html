{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{% block title %}Study Flow{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">        <meta name="csrf_token" content="{{ csrf_token }}">
    </head>
    <body>

        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'index' %}">StudyLoft</a>
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNavAltMarkup"
                        aria-controls="navbarNavAltMarkup"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        {% if user.is_authenticated %}
                            <a class="nav-link active" aria-current="page" href="{% url 'index' %}">Home</a>
                            <a class="nav-link" href="#">Projects</a>
                            <a class="nav-link" href="#">Thesis (plural?)</a>
                            <a class="nav-link" href="#">My Profile</a>
                            <a class="nav-link" href="#">My Subjects</a>
                            <a href="{% url 'logout_view' %}"> Log-out</a>
                        {% else %}
                            <a class="nav-link" href="{% url 'login_view' %}">Log-in</a>
                            <a class="nav-link" href="{% url 'register_view' %}">Register</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>

        <div class="body">
            {% if message %}
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}

            {% block body %}
            {% endblock %}
        </div>       
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
